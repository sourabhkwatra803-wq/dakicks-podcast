<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakicks Podcast Studio</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="p-6 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wider text-indigo-400">DAKICKS PODCAST</h1>
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition">
            Sign In / Login
        </button>
    </header>

    <!-- Main Hero Section -->
    <main class="flex-1 flex flex-col items-center justify-center text-center p-6">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-4 max-w-3xl">
            Next-Gen 4K Studio & Live Q&A Podcasting
        </h2>
        <p class="text-slate-400 text-lg mb-8 max-w-xl">
            Crystal clear AI noise cancellation, face-to-face simulation, and live audience interaction.
        </p>
        <button class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-8 py-4 rounded-xl text-lg shadow-lg transition">
            Start Live Studio
        </button>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-slate-600 text-sm border-t border-slate-900">
        &copy; 2026 Dakicks. All rights reserved.
    </footer>

</body>
</html>
