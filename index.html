<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakicks Podcast Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="p-6 border-b border-slate-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wider text-indigo-400">DAKICKS PODCAST</h1>
        <button onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition">
            Sign In / Login
        </button>
    </header>

    <!-- Main Hero Section -->
    <main class="flex-1 flex flex-col items-center justify-center text-center p-6">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-4 max-w-3xl">
            Next-Gen 4K Studio & Live Q&A Podcasting
        </h2>
        <p class="text-slate-400 text-lg mb-8 max-w-xl">
            Crystal clear AI noise cancellation, face-to-face simulation, and live audience interaction.
        </p>
        <button onclick="openAuthModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-8 py-4 rounded-xl text-lg shadow-lg transition">
            Start Live Studio
        </button>
    </main>

    <!-- Authentication Modal (Hidden by default) -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full text-center relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">&times;</button>
            <h3 class="text-2xl font-bold mb-2">Welcome to Dakicks</h3>
            <p class="text-slate-400 text-sm mb-6">Sign in to save your podcast recordings & UIDs</p>
            
            <div class="space-y-3">
                <!-- Google Login Button -->
                <button onclick="handleLogin('Google')" class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-semibold py-3 px-4 rounded-xl hover:bg-slate-100 transition">
                    <span>Continue with Google</span>
                </button>
                <!-- Microsoft Login Button -->
                <button onclick="handleLogin('Microsoft')" class="w-full flex items-center justify-center gap-3 bg-slate-800 text-white font-semibold py-3 px-4 rounded-xl border border-slate-700 hover:bg-slate-700 transition">
                    <span>Continue with Microsoft</span>
                </button>
                <!-- Apple Login Button -->
                <button onclick="handleLogin('Apple')" class="w-full flex items-center justify-center gap-3 bg-black text-white font-semibold py-3 px-4 rounded-xl border border-slate-700 hover:bg-slate-900 transition">
                    <span>Continue with Apple</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="p-4 text-center text-slate-600 text-sm border-t border-slate-900">
        &copy; 2026 Dakicks. All rights reserved.
    </footer>

    <!-- Basic JS for Modal Interaction -->
    <script>
        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
        }
        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }
        function handleLogin(provider) {
            alert('Connecting to ' + provider + ' Authentication...');
            // Yahan backend Firebase/Auth0 integration aayegi
        }
    </script>
</body>
</html>
